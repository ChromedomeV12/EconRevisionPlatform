name: Verify

on:
  pull_request:
  push:
    branches: [main, m1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Run public unit tests
        run: node --test tests/*.test.cjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file" || exit 1
          done < <(git ls-files -z -- '*.js' '*.cjs' '*.mjs')
      - name: Check public packaging boundary
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const tracked = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const forbidden = /(^|\/)(private-sources|\.ocr-runtime|\.pi|\.agents|\.codex|\.aws|node_modules|\.venv|__pycache__|test-output)(\/|$)|(^|\/)\.env(?:\.|$)/i;
          for (const file of tracked) {
            assert.ok(!/(^|\/)pi-session-[^/]+\.(html|jsonl)$/i.test(file), `Private session export tracked: ${file}`);
            assert.ok(!forbidden.test(file) || /(^|\/)\.env\.example$/.test(file), `Private/local file tracked: ${file}`);
            assert.ok(!fs.lstatSync(file).isSymbolicLink(), `Review linked publication input: ${file}`);
          }
          const publicFiles = tracked.filter(file => /^(assets|vendor|content)\//.test(file) || /^[^/]+\.(html|css|js)$/.test(file) || file === '.nojekyll');
          const privateReference = /(?:^|[^a-z0-9_$])(?:private-sources|\.ocr-runtime|\.pi)[/\\]/i;
          assert.ok(!privateReference.test('const radians = Math.PI/180;'));
          for (const sample of ['"private-sources/book.pdf"', '"/.PI/settings.json"', '"C:\\work\\.ocr-runtime\\file"']) {
            assert.ok(privateReference.test(sample), `Private-path regression: ${sample}`);
          }
          for (const file of ['index.html', 'app.js', 'content.js', 'styles.css', 'acrylic.css', 'theme.js', 'theme.css', 'graph.js', 'graph.css', 'vendor/d3.min.js', 'vendor/d3.LICENSE', 'learning.js', 'refresh.js', 'decisions.js', '.nojekyll']) {
            assert.ok(publicFiles.includes(file), `Missing tracked public runtime file: ${file}`);
          }
          const staging = fs.mkdtempSync(path.join(os.tmpdir(), 'econ-public-check-'));
          try {
            for (const file of publicFiles) {
              if (/\.(html|css|js)$/i.test(file)) {
                const text = fs.readFileSync(file, 'utf8');
                assert.ok(!privateReference.test(text), `Private path in runtime: ${file}`);
              }
              const destination = path.join(staging, file);
              fs.mkdirSync(path.dirname(destination), { recursive: true });
              fs.copyFileSync(file, destination);
            }
            console.log(`Public boundary smoke check passed for ${publicFiles.length} files.`);
          } finally {
            fs.rmSync(staging, { recursive: true, force: true });
          }
          NODE

  adaptive-browser:
    name: adaptive-browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/econ-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/econ-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check adaptive layouts and touch controls
        run: |
          export PLAYWRIGHT_PATH="$RUNNER_TEMP/econ-browser/node_modules/playwright"
          node tests/adaptive-state.cjs
          node tests/adaptive-layout.cjs
          node tests/feed-controls.cjs
          node tests/layout.cjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adaptive-layout-screenshots
          path: |
            test-output/adaptive/*.png
            test-output/feed-controls/*.png
            test-output/layout/*.png
          if-no-files-found: error
          retention-days: 30
